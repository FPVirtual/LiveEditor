name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The build needs the deployment configuration; the workflow uses the
      # reference values from .env.example (LIAEDIT_HIDE_GIT=true, no OAuth).
      - run: cp .env.example .env

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: liveeditor-dist
          path: dist/
          retention-days: 14
